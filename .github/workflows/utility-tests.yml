name: Utility reading checks
on:
  pull_request:
    paths:
      - "history.js"
      - "app.js"
      - "style.css"
      - "sw.js"
      - "index.html"
      - "reset-app.html"
      - "tests/**"
      - ".github/workflows/utility-tests.yml"
  push:
    branches: [main]
    paths:
      - "app.js"
      - "style.css"
      - "sw.js"
      - "index.html"
      - "reset-app.html"
      - "tests/**"
      - ".github/workflows/utility-tests.yml"
permissions:
  contents: read
jobs:
  utility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/test_energy_history.mjs
      - run: node --check history.js
      - run: node --check app.js
      - run: node --check sw.js
      - run: node tests/test_pwa_cache.mjs
      - run: node tests/test_utility_ek.mjs
